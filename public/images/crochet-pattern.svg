<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <g fill="none" stroke="#97A46D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.38">
